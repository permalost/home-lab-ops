substitutions:
  name: ble-proxy-01
  friendly_name: BLE Proxy 01

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  # Board on hand is an ESP32-C6 (RISC-V), not classic ESP32 (Xtensa) — first
  # flash attempt failed with "This chip is ESP32-C6, not ESP32". C6's
  # Arduino core support is limited; esp-idf is the framework ESPHome expects
  # for it.
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

# active: true is mandatory — Homebox/OpenDisplay label pushes need a sustained
# BLE connection to upload an image, not just advertisement scanning. Shelly
# proxies can't do this for the same reason: passive-only.
bluetooth_proxy:
  active: true

esp32_ble_tracker:
