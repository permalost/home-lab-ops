# talhelper configuration for the orion cluster
# Generate machineconfigs: task talos:gen-config
# Reference: https://budimanjojo.github.io/talhelper/latest/reference/configuration/

clusterName: orion
talosVersion: v1.13.7
kubernetesVersion: v1.33.0
endpoint: https://10.50.0.10:6443

# CNI is managed by Cilium; disable built-in CNI and kube-proxy
cniConfig:
  name: none

# Additional SANs added to the API server certificate
additionalApiServerCertSans:
  - 10.50.0.10
  - orion-api.norseamerican.com

clusterPodNets:
  - 10.241.0.0/16
clusterSvcNets:
  - 10.141.0.0/16

# Cluster-wide patches applied to every node
patches:
  - "@./patches/cluster/00-features.yaml"
  - "@./patches/cluster/10-network-common.yaml"
  - "@./patches/cluster/20-kubelet-common.yaml"
  - "@./patches/cluster/30-cilium-prep.yaml"
  - "@./patches/cluster/40-rook-ceph-prep.yaml"

# Control-plane role patches applied in addition to cluster patches
controlPlane:
  patches:
    - "@./patches/controlplane/00-etcd.yaml"
    - "@./patches/controlplane/10-apiserver.yaml"
    - "@./patches/controlplane/20-allow-scheduling.yaml"

nodes:
  # ── Control Plane ─────────────────────────────────────────────────────────
  # Hardware: Beelink GK Mini — trunk NIC is enp2s0 on all three units
  # Boot disk: SATA SSD (128 GB), identified by serial via by-id

  - hostname: orion-cp-01
    ipAddress: 10.50.0.11
    controlPlane: true
    installDisk: /dev/disk/by-id/ata-SSD_128GB_2021092600394
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "84:47:09:07:c6:4a"
        dhcp: false
        vlans:
          - vlanId: 50
            mtu: 1500
            dhcp: false
            addresses:
              - 10.50.0.11/24
            routes:
              - network: 0.0.0.0/0
                gateway: 10.50.0.1
            vip:
              ip: 10.50.0.10
          - vlanId: 10
            mtu: 1500
            dhcp: false
            addresses:
              - 10.10.0.11/24
    patches:
      - "@./patches/nodes/orion-cp-01.yaml"

  - hostname: orion-cp-02
    ipAddress: 10.50.0.12
    controlPlane: true
    installDisk: /dev/disk/by-id/ata-SSD_128GB_2021092601145
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "84:47:09:07:c4:ff"
        dhcp: false
        vlans:
          - vlanId: 50
            mtu: 1500
            dhcp: false
            addresses:
              - 10.50.0.12/24
            routes:
              - network: 0.0.0.0/0
                gateway: 10.50.0.1
            vip:
              ip: 10.50.0.10
          - vlanId: 10
            mtu: 1500
            dhcp: false
            addresses:
              - 10.10.0.12/24
    patches:
      - "@./patches/nodes/orion-cp-02.yaml"

  - hostname: orion-cp-03
    ipAddress: 10.50.0.13
    controlPlane: true
    installDisk: /dev/disk/by-id/ata-NGFF_2280_128GB_SSD_2021031902002
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "5c:85:7e:4f:a2:92"
        dhcp: false
        vlans:
          - vlanId: 50
            mtu: 1500
            dhcp: false
            addresses:
              - 10.50.0.13/24
            routes:
              - network: 0.0.0.0/0
                gateway: 10.50.0.1
            vip:
              ip: 10.50.0.10
          - vlanId: 10
            mtu: 1500
            dhcp: false
            addresses:
              - 10.10.0.13/24
    patches:
      - "@./patches/nodes/orion-cp-03.yaml"

  # ── Workers ────────────────────────────────────────────────────────────────
  # Hardware: Bosgame — trunk NIC is enp1s0, boot disk is Kingston 1 TB NVMe
  # (enp2s0 also exists; it carried stale VLANs from the old doubled-interface
  # bug and will be absent from the new render)

  - hostname: orion-w-01
    ipAddress: 10.50.0.21
    controlPlane: false
    installDisk: /dev/disk/by-id/nvme-KINGSTON_OM8PGP41024N-A0_50026B7383880325
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "84:47:09:53:24:d6"
        dhcp: false
        vlans:
          - vlanId: 50
            mtu: 1500
            dhcp: false
            addresses:
              - 10.50.0.21/24
            routes:
              - network: 0.0.0.0/0
                gateway: 10.50.0.1
          - vlanId: 10
            mtu: 1500
            dhcp: false
            addresses:
              - 10.10.0.21/24
    patches:
      - "@./patches/nodes/orion-w-01.yaml"

  - hostname: orion-w-02
    ipAddress: 10.50.0.22
    controlPlane: false
    installDisk: /dev/disk/by-id/nvme-KINGSTON_OM8PGP41024N-A0_50026B738388057D
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "84:47:09:53:28:36"
        dhcp: false
        vlans:
          - vlanId: 50
            mtu: 1500
            dhcp: false
            addresses:
              - 10.50.0.22/24
            routes:
              - network: 0.0.0.0/0
                gateway: 10.50.0.1
          - vlanId: 10
            mtu: 1500
            dhcp: false
            addresses:
              - 10.10.0.22/24
    patches:
      - "@./patches/nodes/orion-w-02.yaml"

  # ── AI/GPU nodes ───────────────────────────────────────────────────────────
  # Hardware: NVIDIA DGX Spark (GB10, arm64) — onboard RJ45 is enP7s7

  - hostname: orion-ai-01
    ipAddress: 10.50.0.31
    controlPlane: false
    installDiskSelector:
      serial: S8C2NG0YA00300
    schematic:
      customization:
        # arm64.nobti baked into the installer itself — machine.install.extraKernelArgs
        # is a no-op on this hardware's systemd-boot/UKI path (confirmed via
        # /proc/cmdline after install; talosctl even warns about it at apply time).
        extraKernelArgs:
          - arm64.nobti
        systemExtensions:
          officialExtensions:
            - siderolabs/nonfree-kmod-nvidia-lts
            - siderolabs/nvidia-container-toolkit-lts
    networkInterfaces:
      # Untagged (no vlans: block) — the Spark's switch port isn't confirmed
      # trunked for VLAN 50 like the other orion nodes. Maintenance-mode DHCP
      # already proved this range is reachable untagged on this port.
      # TODO: move to tagged vlanId 50 (+10) once the switch port is verified.
      - deviceSelector:
          hardwareAddr: "4c:bb:47:80:5a:0c"
        dhcp: false
        mtu: 1500
        addresses:
          - 10.50.0.31/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.50.0.1
    patches:
      - "@./patches/nodes/orion-ai-01.yaml"
