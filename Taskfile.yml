# https://taskfile.dev

version: "3"

vars:
  KUBERNETES_DIR: "{{.ROOT_DIR}}/kubernetes"

dotenv: [".config.env"]

env:
  KUBECONFIG: ./kubeconfig
  SOPS_AGE_KEY_FILE: ~/.config/sops/age/keys.txt

includes:
  gen: .taskfiles/General/Tasks.yml
  flux: .taskfiles/Flux/Tasks.yml
  talos: .taskfiles/Talos/Tasks.yml
  test: .taskfiles/LocalTest/Tasks.yml

tasks:
  default:
    silent: true
    cmds: ["task -l"]
