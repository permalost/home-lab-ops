---
version: "3"

# Talks to the live Forgejo API (admin creds from kubernetes/apps/forgejo/secret.yaml).
tasks:
  bootstrap:
    desc: Create the wdo org, agents team and bot users (idempotent)
    cmds:
      - bash scripts/forgejo.sh bootstrap
  tokens:
    desc: "(Re)mint bot tokens into a sops secret. Optional: OUT=<path>"
    cmds:
      - bash scripts/forgejo.sh tokens {{if .OUT}}OUT={{.OUT}}{{end}}
  protect:
    desc: "Protect a repo's main branch. Required: REPO, TIER (auto|human)"
    requires:
      vars: [REPO, TIER]
    cmds:
      - bash scripts/forgejo.sh protect REPO={{.REPO}} TIER={{.TIER}}
  runner-token:
    desc: Write the wdo org runner registration token into the runner's sops secret
    cmds:
      - bash scripts/forgejo.sh runner-token
  migrate:
    desc: "Import ~/code/<PROJECT> into wdo/<PROJECT> (deny-list + gitleaks). Optional: TIER=auto|human, DRY_RUN=1"
    requires:
      vars: [PROJECT]
    cmds:
      - bash scripts/forgejo.sh migrate PROJECT={{.PROJECT}} {{if .TIER}}TIER={{.TIER}}{{end}} {{if .DRY_RUN}}DRY_RUN={{.DRY_RUN}}{{end}}
