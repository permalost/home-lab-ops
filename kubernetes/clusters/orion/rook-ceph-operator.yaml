apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-operator
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  prune: true
  wait: true
  dependsOn:
    - name: cluster-settings
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/rook-ceph-operator
  decryption:
    provider: sops
    secretRef:
      name: sops-age
