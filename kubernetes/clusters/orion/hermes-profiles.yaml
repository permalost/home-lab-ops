apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-profiles
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 1m30s
  prune: true
  wait: true
  dependsOn:
    - name: cluster-settings
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/hermes-profiles
  decryption:
    provider: sops
    secretRef:
      name: sops-age
