apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unpoller
  namespace: flux-system
spec:
  # vkms ships the VMServiceScrape CRD; without this dependency a fresh
  # install would apply the CR before its kind exists. external-secrets-stores
  # makes the bitwarden-orion ClusterSecretStore (and its CRDs) ready before
  # the ExternalSecret here syncs.
  dependsOn:
    - name: cluster-settings
    - name: vkms
    - name: external-secrets-stores
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/unpoller
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
