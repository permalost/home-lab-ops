apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vllm
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  # Must exceed the Deployments' progressDeadlineSeconds (30m) — this gates
  # Flux's own wait: true health check, a separate budget from the
  # Deployment-level one. Set with margin, not equal.
  timeout: 35m
  prune: true
  wait: true
  dependsOn:
    - name: cilium
    - name: gateway
    - name: cert-manager-issuers
    - name: cluster-settings
    - name: nvidia-device-plugin
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/vllm
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      storageClass: rook-ceph-block
      mainStorageSize: 35Gi
      # One checkpoint plus headroom, not two — the clean-stale-models
      # initContainer (deployment-*.yaml) purges old checkpoints on every
      # pod start, so this doesn't need padding for leftover data. 50Gi:
      # the official Qwen3.6-35B-A3B-FP8 checkpoint alone is ~38GB.
      auxStorageSize: 50Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
