apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox
  namespace: flux-system
spec:
  # 1h/1m/10m like the other CNPG consumers (paperclip, forgejo) — netbox is
  # stable once bootstrapped and the CNPG Cluster takes minutes to roll.
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    - name: cilium
    - name: gateway
    - name: cnpg
    - name: cluster-settings
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/netbox
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
