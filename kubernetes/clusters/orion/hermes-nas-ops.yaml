---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-nas-ops-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 1m30s
  prune: true
  wait: true
  dependsOn:
    - name: hermes-agent
  sourceRef:
    kind: GitRepository
    name: hermes-profiles
  path: ./nas-ops
  postBuild:
    substitute:
      appName: nas-ops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-nas-ops
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: cluster-settings
    - name: hermes-agent
    - name: hermes-profiles
    - name: hermes-nas-ops-config
    - name: rook-ceph-cluster
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/hermes-agent/overlays/nas-ops
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      appName: nas-ops
      subdomain: nas-ops
      storageClass: rook-ceph-block
      storageSize: 5Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
