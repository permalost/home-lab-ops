apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: actual-budget
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 15m
  prune: true
  wait: true
  dependsOn:
    - name: cilium
    - name: gateway
    - name: cert-manager-issuers
    - name: cluster-settings
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/actual-budget
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      appName: actual-budget
      subdomain: budget
      storageClass: rook-ceph-block
      storageSize: 2Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
