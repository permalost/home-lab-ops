apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-k8s-mcp
  namespace: flux-system
spec:
  # hermes-hearth namespace must exist first.
  dependsOn:
    - name: hermes-hearth
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/hermes-k8s-mcp
