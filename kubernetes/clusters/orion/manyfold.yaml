apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: manyfold
  namespace: flux-system
spec:
  # 1h/1m/10m like the other CNPG consumers (paperclip, forgejo, netbox,
  # bookorbit) — the CNPG Cluster takes minutes to roll and the app is
  # stable once up.
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    - name: cilium
    - name: gateway
    - name: cnpg
    - name: nas-storage
    - name: cluster-settings
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/manyfold
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      appName: manyfold
      subdomain: models
      storageClass: rook-ceph-block
      storageSize: 1Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
