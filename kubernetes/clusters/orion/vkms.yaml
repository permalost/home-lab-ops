apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vkms
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-settings
  interval: 10m
  retryInterval: 30s
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/vkms
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vkms-alerting
  namespace: flux-system
spec:
  # VMAlertmanagerConfig's CRD is installed by vkms's own HelmRelease — on a
  # fresh install, dry-running this CR in the same Kustomization as its CRD's
  # producer blocks the whole thing from ever converging (Flux dry-runs every
  # resource before applying any of them). Same split as
  # cert-manager/cert-manager-issuers, same reason.
  dependsOn:
    - name: vkms
  interval: 10m
  retryInterval: 30s
  timeout: 1m30s
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/vkms/alerting
