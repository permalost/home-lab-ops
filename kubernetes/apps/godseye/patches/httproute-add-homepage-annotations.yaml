apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "God's Eye View"
    gethomepage.dev/description: "Live public flights, ships, satellites, earthquakes, and CCTV on a 3D globe"
    gethomepage.dev/group: "Intel"
    # No vendor icon exists in dashboard-icons for this app; mdi-earth is
    # homepage's documented fallback syntax (Material Design Icons).
    gethomepage.dev/icon: "mdi-earth"
