apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../webapp/base
  - namespace.yaml

components:
  - ../webapp/components/httproute

namespace: godseye
namePrefix: godseye-

labels:
  - includeSelectors: true
    pairs:
      app: godseye
      app.kubernetes.io/name: godseye

images:
  - name: my-app
    newName: ghcr.io/permalost/gods-eye-view
    newTag: "sha-24437ad-20260911"

patches:
  - target:
      kind: Deployment
      name: deploy
    path: patches/deploy-container-port.yaml
  - target:
      kind: Deployment
      name: deploy
    path: patches/deploy-update-resources.yaml
  - target:
      kind: Deployment
      name: deploy
    path: patches/deploy-probes.yaml
  - target:
      kind: Deployment
      name: deploy
    path: patches/deploy-arch-nodeselector.yaml
  - target:
      kind: Service
      name: svc
    path: patches/svc-target-port.yaml
  - target:
      kind: HTTPRoute
      name: route
    path: patches/httproute-add-homepage-annotations.yaml
