apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pihole

resources:
  - ../../base
  - namespace.yaml
  - loadbalancer.yaml

components:
  - ../../../webapp/components/httproute

# gethomepage.dev discovery for the homepage dashboard; component's
# HTTPRoute is generic and takes no annotations of its own.
patches:
  - path: patches/httproute-add-homepage-annotations.yaml
    target:
      kind: HTTPRoute
      name: route
  # webapp/base's Service defaults to 8080 (what the httproute component
  # assumes); pihole's own container really listens on 80, and
  # patches/svc-update-ports.yaml already moved the Service there — this
  # keeps the HTTPRoute's backend port in sync.
  - path: patches/httproute-update-port.yaml
    target:
      kind: HTTPRoute
      name: route
