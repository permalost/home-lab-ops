apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pihole

resources:
  - ../../base
  - namespace.yaml
  - loadbalancer.yaml

components:
  - ../../../webapp/components/httproute

# gethomepage.dev discovery for the homepage dashboard; component's
# HTTPRoute is generic and takes no annotations of its own.
patches:
  - path: patches/httproute-add-homepage-annotations.yaml
    target:
      kind: HTTPRoute
      name: route

# Webapp port pattern (webapp/README.md, "Changing the port"): keep the
# HTTPRoute backend port on the container port set in base/. The route only
# exists in this overlay, so its wiring lives here.
replacements:
  - source:
      kind: Deployment
      name: deploy
      fieldPath: spec.template.spec.containers.0.ports.0.containerPort
    targets:
      - select:
          kind: HTTPRoute
          name: route
        fieldPaths:
          - spec.rules.0.backendRefs.0.port
