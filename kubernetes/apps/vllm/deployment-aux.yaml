# Hermes "auxiliary" model — title generation, context compression, approval
# scoring, web summarization. High-volume/low-difficulty, so throughput (NVFP4 +
# MTP, ~108 tok/s measured) matters more here than the raw quality edge vllm-main has.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-aux
  labels:
    app.kubernetes.io/name: vllm-aux
    model: qwen3.6-35b-a3b
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-aux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-aux
        model: qwen3.6-35b-a3b
    spec:
      serviceAccountName: default
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # See deployment-main.yaml — same taint caveat applies.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          # TODO: same digest-pin caveat as deployment-main.yaml.
          image: "vllm/vllm-openai:cu130-nightly"
          imagePullPolicy: IfNotPresent
          args:
            - --model=nvidia/Qwen3.6-35B-A3B-NVFP4
            - --served-model-name=qwen3.6-35b-a3b
            - --quantization=modelopt
            - --port=8000
            - --download-dir=/models
            - --max-model-len=65536
            - --max-num-seqs=8
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            - --enable-prefix-caching
            - --gpu-memory-utilization=0.30
            - --speculative-config={"method":"qwen3_next_mtp","num_speculative_tokens":3}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /models
          volumeMounts:
            - name: weights
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "2"
              memory: 35Gi
            limits:
              cpu: "8"
              memory: 40Gi
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: vllm-aux-weights
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
