# Hermes "auxiliary" model — title generation, context compression, approval
# scoring, web summarization.
#
# Official checkpoint (Qwen/Qwen3.6-35B-A3B-FP8), stock vllm-openai image —
# same image as vllm-main, no community fork. Replaces an earlier
# AEON-7/NVFP4 setup: NVIDIA's own NVFP4 checkpoint hit an open vLLM bug on
# this hardware (KeyError loading MoE expert scale tensors — vLLM #44081,
# #38980), so we ran an uncensored community re-quantization + patched image
# instead. Dropped in favor of this FP8 checkpoint, which sidesteps both the
# NVFP4 bug and the trust/audit tradeoff of that image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-aux
  labels:
    app.kubernetes.io/name: vllm-aux
    model: qwen3.6-35b-a3b
spec:
  revisionHistoryLimit: 3
  replicas: 1
  # See deployment-main.yaml.
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-aux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-aux
        model: qwen3.6-35b-a3b
    spec:
      serviceAccountName: default
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # See deployment-main.yaml.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        # Deletes any cached checkpoint that doesn't match the model below —
        # see deployment-main.yaml. KEEP must match the model arg exactly.
        - name: clean-stale-models
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              set -eu
              cd /models
              KEEP="models--Qwen--Qwen3.6-35B-A3B-FP8"
              for d in models--*; do
                [ -d "$d" ] || continue
                if [ "$d" != "$KEEP" ]; then
                  echo "Removing stale model cache: $d"
                  rm -rf -- "$d"
                fi
              done
          volumeMounts:
            - name: weights
              mountPath: /models
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
        # Waits for vllm-main to be healthy before this pod loads. Time-
        # slicing gives no memory isolation between the two — simultaneous
        # loads once starved vllm-main of its GPU memory share mid-startup
        # (see README.md). Sequencing keeps their memory peaks from overlapping.
        - name: wait-for-main
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              set -eu
              until wget -q -T 5 -O /dev/null http://vllm-main.vllm.svc.cluster.local:8000/health; do
                echo "Waiting for vllm-main..."
                sleep 15
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: vllm
          # TODO: pin to a resolved digest — see deployment-main.yaml.
          image: "vllm/vllm-openai:cu130-nightly"
          imagePullPolicy: IfNotPresent
          args:
            - --model=Qwen/Qwen3.6-35B-A3B-FP8
            - --served-model-name=qwen3.6-35b-a3b
            - --port=8000
            - --download-dir=/models
            - --max-model-len=65536
            - --max-num-seqs=8
            - --enable-auto-tool-choice
            - --tool-call-parser=qwen3_coder
            - --enable-prefix-caching
            # No --quantization/--kv-cache-dtype flags — official FP8
            # checkpoint auto-detects, same as vllm-main.
            - --gpu-memory-utilization=0.40
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /models
          volumeMounts:
            - name: weights
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          resources:
            # Measured real peak ~33GB (cgroup memory.peak) — sized with
            # headroom above that, same rationale as vllm-main.
            requests:
              cpu: "2"
              memory: 45Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: 65Gi
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: vllm-aux-weights
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
