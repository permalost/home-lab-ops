# Hermes "main" model. Qwen3.6-27B leads the MoE aux model on agentic
# benchmarks — see kubernetes/apps/vllm/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-main
  labels:
    app.kubernetes.io/name: vllm-main
    model: qwen3.6-27b
spec:
  revisionHistoryLimit: 3
  replicas: 1
  # Must stay >= startupProbe's cold-load budget below. K8s' own default
  # (600s) is a separate watchdog from the probe and fires independently,
  # marking the rollout Failed before a slow-but-fine load finishes.
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-main
        model: qwen3.6-27b
    spec:
      serviceAccountName: default
      automountServiceAccountToken: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # Must match the taint applied by hand via `kubectl taint` on
      # orion-ai-01 (not in git — NodeRestriction blocks Talos from setting
      # it). Verify with `kubectl describe node orion-ai-01` if scheduling fails.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # Deletes any cached checkpoint that doesn't match the model below, so
      # switching models doesn't leave orphaned data filling the PVC. KEEP
      # must match the model arg exactly or this deletes what's about to load.
      initContainers:
        - name: clean-stale-models
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              set -eu
              cd /models
              KEEP="models--Qwen--Qwen3.6-27B-FP8"
              for d in models--*; do
                [ -d "$d" ] || continue
                if [ "$d" != "$KEEP" ]; then
                  echo "Removing stale model cache: $d"
                  rm -rf -- "$d"
                fi
              done
          volumeMounts:
            - name: weights
              mountPath: /models
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      containers:
        - name: vllm
          # TODO: pin to a resolved digest. Stock vLLM images lack sm_121
          # (Blackwell) kernels for aarch64 — needs the CUDA 13 nightly
          # track (vLLM #36821, DGX Spark writeup linked in README.md).
          image: "vllm/vllm-openai:cu130-nightly"
          imagePullPolicy: IfNotPresent
          args:
            - --model=Qwen/Qwen3.6-27B-FP8
            - --served-model-name=qwen3.6-27b
            - --port=8000
            - --download-dir=/models
            - --max-model-len=65536
            - --max-num-seqs=8
            - --enable-auto-tool-choice
            # Not "hermes" — that name refers to the parser's origin, not
            # this model family. Wrong parser = tool calls as literal JSON.
            - --tool-call-parser=qwen3_coder
            - --enable-prefix-caching
            # Computed against currently-free memory at the instant this
            # engine initializes, not a fixed reservation (same mechanism as
            # vllm-aux — see its comment and README.md). 0.40 leaves enough
            # margin above the real measured weights (28.51GB) plus KV
            # cache/activations; wait-for-main on vllm-aux sequences the two
            # cold starts so neither claims its share while the other is
            # mid-init.
            - --gpu-memory-utilization=0.40
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /models
          volumeMounts:
            - name: weights
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          resources:
            # Unified memory: weights + KV cache draw from this, not a
            # separate host-RAM budget. Measured real peak ~38GB (cgroup
            # memory.peak) — sized with headroom above that. This is a
            # comprehensive RSS ceiling (weights + CUDA/Python framework
            # overhead), a different number from the vLLM-level target above.
            requests:
              cpu: "2"
              memory: 40Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: 58Gi
              nvidia.com/gpu: 1
          # Cold start = weight load + JIT compile. Generous startupProbe
          # avoids a restart-loop before first serve.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: vllm-main-weights
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
