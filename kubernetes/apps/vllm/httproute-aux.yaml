# See httproute-main.yaml — same rationale, optional external access.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-aux
spec:
  parentRefs:
    - name: ${gatewayName}
      namespace: gateway
      sectionName: https
  hostnames:
    - vllm-aux.${domain}
  rules:
    - backendRefs:
        - name: vllm-aux
          port: 8000
