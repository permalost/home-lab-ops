; Obsidian Self-hosted LiveSync backend config.
; See https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/setup_own_server.md
[couchdb]
single_node = true
max_document_size = 50000000

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
credentials = true
; capacitor://localhost is the mobile app's webview origin; app://obsidian.md
; is desktop. Both are required or the plugin's "Test Database Connection"
; fails with a vague network error.
origins = app://obsidian.md,capacitor://localhost,http://localhost
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
