# Official couchdb image runs as the non-root `couchdb` user (uid/gid 5984)
# by default, but only if told to — with no runAsUser, the container starts
# as root instead. The entrypoint then chown -Rs /opt/couchdb to couchdb:
# couchdb, which includes the ConfigMap-mounted local.ini — ConfigMap
# volumes are always read-only, so that chown fails. `-f` only silences the
# message, not find -exec's exit code, so `set -e` kills the entrypoint
# before it prints anything. Confirmed live: running the entrypoint as uid
# 5984 (skipping the chown block entirely, per its own root-vs-non-root
# branch) boots cleanly.
#
# runAsUser skips that chown pass altogether (runAsNonRoot comes from
# webapp/base). fsGroup still makes the CSI driver chown the PVC's mount to
# that gid so it can write /opt/couchdb/data.
#
# The entrypoint unconditionally touches /opt/couchdb/etc/local.d/docker.ini
# on the container filesystem (and appends the COUCHDB_* admin to it until
# present), so the read-only root filesystem is opted out of — the only
# relaxation; drop-ALL and no-privilege-escalation from the base still apply.
- op: add
  path: /spec/template/spec/securityContext/runAsUser
  value: 5984
- op: add
  path: /spec/template/spec/securityContext/fsGroup
  value: 5984
- op: add
  path: /spec/template/spec/containers/0/securityContext/readOnlyRootFilesystem
  value: false
