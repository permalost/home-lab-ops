apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo
resources:
  - namespace.yaml
  - secret.yaml
  - rustfs-credentials.sops.yaml
  - database.yaml
  - objectstore.yaml
  - backup.yaml
  - repository.yaml
  - release.yaml

configMapGenerator:
- name: forgejo-helm-chart-values
  files:
  - values.yaml

configurations:
  - kustomizeconfig.yaml
patches:
  - path: cluster-wal-archiver-patch.yaml
