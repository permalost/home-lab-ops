apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  interval: 15m
  chart:
    spec:
      chart: forgejo
      version: "17.2.0"
      sourceRef:
        kind: HelmRepository
        name: forgejo
      interval: 15m
  releaseName: forgejo
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: forgejo-helm-chart-values
      valuesKey: values.yaml
