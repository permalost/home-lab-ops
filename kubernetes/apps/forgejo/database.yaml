apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
spec:
  instances: 2
  # Pinned to the first post-eMudhra-fix weekly build (2026-10-26); the
  # operator default tag is floating and never rolls existing pods.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-system-trixie
  storage:
    size: 10Gi
    storageClass: rook-ceph-block
  # Creates Secret forgejo-db-app (host, dbname, user, password) for the chart.
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
