apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  labels:
    app: unpoller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unpoller
  template:
    metadata:
      labels:
        app: unpoller
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: unpoller
          image: unpoller
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9130
              protocol: TCP
          env:
            - name: UP_UNIFI_CONTROLLER_0_URL
              valueFrom:
                secretKeyRef:
                  name: unpoller-credentials
                  key: UP_UNIFI_CONTROLLER_0_URL
            - name: UP_UNIFI_CONTROLLER_0_USER
              valueFrom:
                secretKeyRef:
                  name: unpoller-credentials
                  key: UP_UNIFI_CONTROLLER_0_USER
            - name: UP_UNIFI_CONTROLLER_0_PASS
              valueFrom:
                secretKeyRef:
                  name: unpoller-credentials
                  key: UP_UNIFI_CONTROLLER_0_PASS
            # The image's bundled up.conf enables the InfluxDB output; this
            # stack is Prometheus-only (vkms).
            - name: UP_INFLUXDB_DISABLE
              value: "true"
            # unpoller v5 defaults the prefix to "unpoller_"; the WDO-20
            # Phase 2 alert rules expect "unifi_".
            - name: UP_PROMETHEUS_NAMESPACE
              value: unifi
            # The controller serves a self-signed cert for a name that matches
            # no in-cluster address, and the audit user is read-only anyway —
            # same tradeoff as the unifi BackendTLSPolicy in external-endpoints.
            - name: UP_UNIFI_CONTROLLER_0_VERIFY_SSL
              value: "false"
          # /metrics is served from the 60s poll cache, so probing it doesn't
          # hit the controller API.
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
