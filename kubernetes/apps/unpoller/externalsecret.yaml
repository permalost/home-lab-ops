apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller-credentials
spec:
  # Values live in the Bitwarden orion-apps project (store bitwarden-orion).
  # A rotation is an edit in Bitwarden; the pod still needs a restart.
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-orion
    kind: ClusterSecretStore
  # Same name and keys as the Secret the sops file used to create, so
  # deployment.yaml keeps reading them unchanged.
  target:
    name: unpoller-credentials
  data:
    - secretKey: UP_UNIFI_CONTROLLER_0_URL
      remoteRef:
        key: unpoller-UP_UNIFI_CONTROLLER_0_URL
    - secretKey: UP_UNIFI_CONTROLLER_0_USER
      remoteRef:
        key: unpoller-UP_UNIFI_CONTROLLER_0_USER
    - secretKey: UP_UNIFI_CONTROLLER_0_PASS
      remoteRef:
        key: unpoller-UP_UNIFI_CONTROLLER_0_PASS
