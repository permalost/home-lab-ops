# Root for the Flux Kustomization in clusters/orion/bookorbit.yaml. It only
# aggregates; all naming and labels live in app/.
#
# bookorbit-secret.sops.yaml deliberately sits outside app/, whose namePrefix
# would rename the rendered Secret (bookorbit-secret -> bookorbit-bookorbit-
# secret). It was encrypted with metadata.name: bookorbit-secret, and editing
# the name of an encrypted file breaks its SOPS MAC, so the rendered Secret
# must keep the name the MAC was computed over (same shape as apps/firefly/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app
  - bookorbit-secret.sops.yaml
  - rustfs-credentials.sops.yaml
