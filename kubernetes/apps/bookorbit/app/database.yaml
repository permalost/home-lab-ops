apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  # namePrefix renders this as bookorbit-db; the operator then creates the
  # bookorbit-db-app Secret that patches/deploy-add-env.yaml reads from.
  name: db
spec:
  instances: 1
  # Standard image (not minimal): it ships the pgvector extension BookOrbit
  # requires. Pinned to the same 2026-10-26 weekly build as the other CNPG
  # consumers (paperclip, forgejo, netbox); the operator default tag is
  # floating and never rolls existing pods.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-standard-trixie
  storage:
    size: 5Gi
    storageClass: rook-ceph-block
  # Creates Secret bookorbit-db-app (host, port, dbname, user, password, uri, ...).
  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      # BookOrbit's migrate script runs these same CREATE EXTENSION IF NOT
      # EXISTS statements on first boot (upstream server/src/scripts/
      # postgres-extensions.ts); pre-creating them documents the requirement
      # and keeps the cluster correct even before the app starts.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
        - CREATE EXTENSION IF NOT EXISTS "pg_trgm"
        - CREATE EXTENSION IF NOT EXISTS "unaccent"
        - CREATE EXTENSION IF NOT EXISTS "vector"
