apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../webapp/base
  - namespace.yaml

components:
  - ../webapp/components/httproute      # Gateway API route — the default; orion has no nginx ingress controller
  - ../webapp/components/pvc            # mounts /data; set storageClass + storageSize in cluster shell postBuild.substitute

namespace: actual-budget
namePrefix: actual-budget-

labels:
  - includeSelectors: true
    pairs:
      app: actual-budget
      app.kubernetes.io/name: actual-budget

images:
  - name: my-app
    newName: docker.io/actualbudget/actual-server
    newTag: "26.10.0"

patches:
  - target:
      kind: Deployment
      name: deploy
    path: patches/deploy-container-port.yaml
  - target:
      kind: Deployment
      name: deploy
    path: patches/deploy-security-context.yaml
  - target:
      kind: Deployment
      name: deploy
    path: patches/deploy-update-resources.yaml
  - target:
      kind: Service
      name: svc
    path: patches/svc-target-port.yaml
  - target:
      kind: HTTPRoute
      name: route
    path: patches/httproute-add-homepage-annotations.yaml
