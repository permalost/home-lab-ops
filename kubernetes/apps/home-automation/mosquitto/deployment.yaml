apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
      annotations:
        # configMap.yaml is referenced by static name, not configMapGenerator,
        # so content changes don't get a hash suffix that forces a rollout.
        # The initContainer copies config unconditionally on every boot, so
        # bumping this (any value, e.g. short description of what changed)
        # is enough to roll the pod and pick it up.
        home-lab-ops/config-generation: "2-hass-mqtt-user-password-rotated"
    spec:
      initContainers:
        - name: init-config
          image: eclipse-mosquitto:2.0.18
          command:
            [
              "sh",
              "-c",
              "cp -Lr /src/* /dest/ && chmod a+rw /dest/mosquitto.conf && chown root /dest/password_file && chmod 700 /dest/password_file",
            ]
          volumeMounts:
            - name: config-src
              mountPath: /src
            - name: config
              mountPath: /dest
      containers:
        - name: mosquitto
          image: "eclipse-mosquitto:2.0.18"
          imagePullPolicy: IfNotPresent
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /mosquitto/data
            - name: config
              mountPath: /mosquitto/config
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 60
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 60
          startupProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 0
            failureThreshold: 30
            timeoutSeconds: 1
            periodSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
        - name: config
          persistentVolumeClaim:
            claimName: mosquitto-conf
        - name: config-src
          configMap:
            name: mosquitto-base-config
