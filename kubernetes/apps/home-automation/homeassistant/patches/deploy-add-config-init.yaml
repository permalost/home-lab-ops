# pvc component (applied first, before this app's own patches) already
# adds the "data" volume + a volumeMount at /data on container 0 — this
# only appends the config-src volume onto that (via /-, not a full
# replace) and adds the initContainer. See
# patches/deploy-config-mountpath.yaml for /data -> /config.
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: config-src
    configMap:
      name: settings
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: init-config
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        # SEED_VERSION history:
        #   1 - initial configuration.yaml (default_config, http.trusted_proxies,
        #       homeassistant.external_url)
        #   2 - moved http.* out of configuration.yaml into .storage/http,
        #       pre-marked "stable" — HA stages YAML http: config as an
        #       unconfirmed "pending" trial that auto-reverts if nothing
        #       promotes it within 5 minutes of boot (fine interactively,
        #       impossible for an unattended deploy); seeding storage
        #       directly, already confirmed, skips that trial entirely.
        #   3 - added rest: sensors for the local Neurio energy monitor
        #       (apps/external-endpoints/neurio).
        #   4 - added rest: sensors for Grocy pantry tracking
        #       (apps/grocy): due/overdue/expired/missing product counts
        #       and shopping list item count.
        #   5 - added automation/scene/script includes, split git-owned
        #       (automations_gitops.yaml, re-copied unconditionally every
        #       boot — same as mosquitto's pattern, can't drift) from
        #       UI-owned (automations.yaml/scenes.yaml/scripts.yaml, only
        #       created if missing so the HA editor's writes survive
        #       restarts). See home-automation/README.md.
        #   6 - motion-lighting window retimed: activation from sunset-1h
        #       (was sunset), red window from sunset+1h (was sunset+2h).
        #       automations_gitops.yaml copies unconditionally regardless
        #       of this version, but the pod still needs to restart to
        #       pick it up — bumping SEED_VERSION is what forces that.
        #   7 - motion-lights auto-off delay shortened 5min -> 1min.
        #   8 - red window moved sunset+1h -> sunset+30m; auto-off delay
        #       shortened 1min -> 30sec.
        #   9 - added sunrise handling: red window now ends at sunrise-30m
        #       (was sunrise), a new dawn white window covers
        #       sunrise-30m->sunrise+30m, and motion activation stops
        #       entirely 30m after sunrise. Hall's red_data brightness
        #       bumped 20% -> 25%.
        #   10 - esl_sync_labels: hourly automation pushing Homebox location
        #        labels (labelmaker PNG) to paired Solum Newton ESL tags via
        #        the core opendisplay integration, over an ESPHome BLE proxy
        #        (esphome/ble-proxy-01.yaml). Added homeassistant.media_dirs,
        #        shell_command.esl_fetch_label, input_text per-tag hash.
        #   11 - BUGFIX (#10 broke boot, HA fell back to recovery_mode):
        #        homeassistant.media_dirs.esl (/config/esl) must already
        #        exist as a directory at config-check time or the
        #        `homeassistant:` integration hard-fails — confirmed via
        #        POST /api/config/core/check_config against the live pod
        #        ("Not a directory for dictionary value 'media_dirs->esl'").
        #        shell_command.esl_fetch_label's own `mkdir -p /config/esl`
        #        only runs when the automation fires, too late for boot.
        #        Now created unconditionally, every boot, before HA starts.
        [
          "SEED_VERSION=11; if [ ! -f /dest/configuration.yaml ] || [ \"$(cat /dest/.seed-version 2>/dev/null)\" != \"$SEED_VERSION\" ]; then cp /src/configuration.yaml /dest/configuration.yaml && chmod +w /dest/configuration.yaml && mkdir -p /dest/.storage && cp /src/http-storage.json /dest/.storage/http && chmod +w /dest/.storage/http && echo \"$SEED_VERSION\" > /dest/.seed-version; fi; cp /src/automations_gitops.yaml /dest/automations_gitops.yaml && chmod +w /dest/automations_gitops.yaml; mkdir -p /dest/esl; for f in automations.yaml scenes.yaml scripts.yaml; do [ -f \"/dest/$f\" ] || { echo '[]' > \"/dest/$f\" && chmod +w \"/dest/$f\"; }; done",
        ]
      volumeMounts:
        - name: config-src
          mountPath: /src
        - name: data
          mountPath: /dest
