apiVersion: v1
kind: Namespace
metadata:
  name: home-automation
  labels:
    gateway.networking.k8s.io/access: "true"
    # The cluster's API-server PSA default (no namespace labels set) enforces
    # baseline, which forbids adding any capability beyond NET_BIND_SERVICE.
    # homeassistant needs NET_RAW for raw ICMP sockets (ping integration, kept
    # deliberately in its deploy-security-context.yaml), so this namespace
    # opts out of Pod Security enforcement — same shape as apps/forgejo-runner.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
