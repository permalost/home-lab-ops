# Binds to service.yaml via the kubernetes.io/service-name label — that's
# the only link, the EndpointSlice's own name doesn't matter.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: neurio
  labels:
    kubernetes.io/service-name: neurio
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 80
endpoints:
  - addresses:
      - 10.30.0.217
