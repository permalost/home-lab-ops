apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bignas
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: "https://bignas.${domain}"
    gethomepage.dev/name: "BigNAS"
    gethomepage.dev/description: "HDD NAS"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "truenas.png"
spec:
  parentRefs:
    - name: ${gatewayName}
      namespace: gateway
      sectionName: https
  hostnames:
    - "bignas.${domain}"
  rules:
    - backendRefs:
        - name: bignas
          port: 443
