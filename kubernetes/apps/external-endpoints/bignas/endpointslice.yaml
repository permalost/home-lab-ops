# Binds to service.yaml via the kubernetes.io/service-name label — that's
# the only link, the EndpointSlice's own name doesn't matter.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: bignas
  labels:
    kubernetes.io/service-name: bignas
addressType: IPv4
ports:
  - name: https
    protocol: TCP
    port: 443
endpoints:
  - addresses:
      - 10.50.0.32
