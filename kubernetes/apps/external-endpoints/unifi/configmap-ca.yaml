# Unifi's own self-signed leaf cert, trusted as its own CA (chain of one) so
# BackendTLSPolicy can validate the re-encrypted hop to it. Pulled with:
#   echo | openssl s_client -connect 10.20.0.1:443 -servername 10.20.0.1 \
#     2>/dev/null | openssl x509 > ca.crt
# Re-run and update if the controller's cert is ever regenerated (currently
# valid to 2028-06-18; not a secret, it's a public leaf cert).
#
# 2026-09-03: was pinned to port 8443 and a 2025-vintage "CN=UniFi" cert,
# neither of which the controller actually serves anymore (confirmed 8443
# is dead — no server header, 404 on every path — and the live cert on 443
# is a different self-signed leaf, CN=unifi.local, issued 2026-03-16). This
# route was silently broken until this fix; verify with curl if it acts up
# again rather than assuming the port/cert on file is still right.
apiVersion: v1
kind: ConfigMap
metadata:
  name: unifi-ca
