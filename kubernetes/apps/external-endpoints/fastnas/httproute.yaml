apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fastnas
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/siteMonitor: "https://fastnas.${domain}"
    gethomepage.dev/name: "FastNAS"
    gethomepage.dev/description: "SSD NAS"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "truenas.png"
spec:
  parentRefs:
    - name: ${gatewayName}
      namespace: gateway
      sectionName: https
  hostnames:
    - "fastnas.${domain}"
  rules:
    - backendRefs:
        - name: fastnas
          port: 443
