apiVersion: apps/v1
kind: Deployment
metadata:
  # namePrefix renders this as manyfold-redis, matching REDIS_URL in
  # patches/deploy-add-env.yaml.
  name: redis
  labels:
    app: manyfold
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manyfold
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app: manyfold
        app.kubernetes.io/component: cache
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: docker.io/library/redis:8.10.3-alpine
          imagePullPolicy: IfNotPresent
          # No persistence on purpose: Manyfold uses Redis for the Sidekiq
          # queues and cache — losing it just re-runs jobs (upstream's
          # docker-compose.example.yml runs redis:7 with no volume).
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The image entrypoint steps down from root via setpriv when it
            # starts as uid 0; with ALL capabilities dropped that fails with
            # EPERM and the container crash loops. Run directly as the
            # image's redis user (uid 999/gid 1000) so the entrypoint takes
            # its non-root path instead (same shape as apps/netbox valkey).
            # Persistence is disabled, so there is nothing to chown.
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app: manyfold
    app.kubernetes.io/component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
