apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../webapp/base
  - namespace.yaml

namespace: flow-collector
namePrefix: flow-collector-

labels:
  - includeSelectors: true
    pairs:
      app: flow-collector
      app.kubernetes.io/name: flow-collector

components:
  - ../webapp/components/pvc

images:
  - name: my-app
    newName: netsampler/goflow2
    newTag: v2.2.6

patches:
  - target:
      kind: Deployment
      name: deploy
    path: patches/deploy-container-port.yaml
  - target:
      kind: Deployment
      name: deploy
    path: patches/deploy-args.yaml
  - target:
      kind: Service
      name: svc
    path: patches/svc-loadbalancer.yaml
