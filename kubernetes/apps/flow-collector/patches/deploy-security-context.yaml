# fsGroup makes the CSI driver chown the PVC's mount to that gid so the
# collector can write /data/flows.json (the rotator runs as 100:65533).
#
# runAsUser: 100 is required on the flow-collector container: the goflow2
# v2.2.7 image declares a non-numeric USER (flow, uid 100 via alpine
# adduser -S), and webapp/base sets runAsNonRoot: true at pod level, so
# the kubelet refuses to create the container ("cannot verify user is
# non-root") unless the securityContext pins a numeric, non-zero uid.
# Both ops target subkeys so they merge into the pod- and container-level
# securityContexts from webapp/base instead of replacing them.
- op: add
  path: /spec/template/spec/securityContext/fsGroup
  value: 65533
- op: add
  # containers/0 is the flow-collector container (rotator is appended as
  # containers/1 by deploy-add-rotator-sidecar, which runs before this).
  path: /spec/template/spec/containers/0/securityContext/runAsUser
  value: 100
