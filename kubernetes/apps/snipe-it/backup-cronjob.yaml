# Tier-1 restic backup for snipe-it (spec #321, GH #326): the MariaDB is
# never copied as raw files — an init container runs mariadb-dump into an
# emptyDir first, and the restic container stores that dump next to the
# snipe-it-data file copy. Restic only starts if the dump succeeded.
#
# The source PVC is RWO (rook-ceph-block), so the pod prefers the node of the
# app pod that holds it — a mount from any other node would fail with
# Multi-Attach. If the app pod is gone the volume is free anywhere, hence
# preferred (soft) affinity, never required. Source mounts are read-only;
# reads are crash-consistent (same as the ceph snapshots).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-tier1-backup
spec:
  schedule: "0 8 * * *"
  timeZone: America/Boise
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # One pass over both NAS targets; generous for the first full copy,
      # incrementals after that are fast.
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restic-tier1-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app: snipe-it
          initContainers:
            - name: mariadb-dump
              # Same pin as the db StatefulSet: the dump must understand the
              # server it reads (mariadb-dump ships in this image).
              image: docker.io/library/mariadb:11.4.13@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
              imagePullPolicy: IfNotPresent
              env:
                # Env var, not argv: avoids the password in the process list.
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: snipe-it-secret
                      key: DB_PASSWORD
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # The dump is the only DB representation that enters the
                  # restic repo (spec #321: never raw live DB files).
                  # --single-transaction: consistent InnoDB snapshot without
                  # blocking writes; --no-tablespaces: dump as non-root user.
                  mariadb-dump --host=snipe-it-db --user=snipeit \
                    --single-transaction --routines --events --no-tablespaces \
                    snipeit > /dump/snipeit.sql
                  echo "dump bytes: $(wc -c < /dump/snipeit.sql)"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: dump
                  mountPath: /dump
          containers:
            - name: restic
              image: docker.io/restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              imagePullPolicy: IfNotPresent
              env:
                - name: RESTIC_PASSWORD_FILE
                  value: /etc/restic/password
                - name: RESTIC_CACHE_DIR
                  value: /tmp/restic-cache
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  # Init-if-missing, backup, retention — per repo. Every repo
                  # is this job's own NAS subdirectory, so no cross-app
                  # restic locking and forget --prune is always safe.
                  for repo in /mnt/restic-bignas /mnt/restic-fastnas; do
                    export RESTIC_REPOSITORY="$repo"
                    if ! restic cat config >/dev/null 2>&1; then
                      echo "restic init $repo"
                      restic init
                    fi
                    restic backup --host snipe-it --tag restic-tier1 \
                      /srv/snipe-it-data /dump
                    restic forget --host snipe-it --group-by host,paths \
                      --keep-daily 14 --keep-weekly 8 --keep-monthly 6 --prune
                  done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: src-snipe-it-data
                  mountPath: /srv/snipe-it-data
                  readOnly: true
                - name: dump
                  mountPath: /dump
                  readOnly: true
                - name: restic-bignas
                  mountPath: /mnt/restic-bignas
                - name: restic-fastnas
                  mountPath: /mnt/restic-fastnas
                - name: password
                  mountPath: /etc/restic
                  readOnly: true
                # /tmp is the container's only writable path: restic cache
                # and any $HOME writes land on this emptyDir.
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: src-snipe-it-data
              persistentVolumeClaim:
                claimName: snipe-it-data
            - name: dump
              emptyDir: {}
            - name: restic-bignas
              persistentVolumeClaim:
                claimName: restic-bignas
            - name: restic-fastnas
              persistentVolumeClaim:
                claimName: restic-fastnas
            - name: password
              secret:
                secretName: restic-repo-password
            - name: tmp
              emptyDir: {}
