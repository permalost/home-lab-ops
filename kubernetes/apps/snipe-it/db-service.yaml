apiVersion: v1
kind: Service
metadata:
  name: snipe-it-db
  labels:
    app.kubernetes.io/name: snipe-it-db
spec:
  # ClusterIP is enough: only the app pod resolves this name, inside the
  # namespace.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: snipe-it-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
