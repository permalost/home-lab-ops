fullnameOverride: k8s-mcp

# No numbered tags are ever published for this image (quay.io only ships
# "latest"), so pin by digest instead — image.version accepts either and
# the chart renders a `@sha256:...` ref when given one. Digest of `latest`
# as of 2026-09-20; bump deliberately, don't drop back to a bare tag.
image:
  version: "sha256:71d2cf69429874fc972388284e337fd892eabdbaea632ca6dcab3b3bdeb2fec4"

ingress:
  enabled: false

rbac:
  extraClusterRoleBindings:
    - name: view
      roleRef:
        name: view
        external: true

config:
  # read_only/disable_destructive used to be --read-only/--disable-destructive
  # CLI flags; the image at this pin only accepts --config/--config-dir now
  # (confirmed live: --read-only crash-looped the pod with "unknown flag").
  # Verified these TOML keys against the actual binary — it rejects unknown
  # config keys outright, so a typo here fails loud, not silent.
  read_only: true
  disable_destructive: true
  # core-only: drops the `config` toolset, which is where
  # configuration_view lives — it returns this server's own live
  # ServiceAccount bearer token to whatever calls it. Nothing the
  # maintenance skill uses is outside `core`.
  toolsets: [core]
  denied_resources:
    - group: ""
      version: v1
      kind: Secret

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 64Mi
