fullnameOverride: k8s-mcp

# Pin by digest — image.version accepts a digest and the chart renders a
# `@sha256:...` ref when given one. Digest of the v0.0.69 release index on
# quay.io (UBI 9 minimal, built 2026-10-23 — post-eMudhra-fix base); bump
# deliberately, don't drop back to a bare tag.
image:
  version: "sha256:1da9d62ad0c008a6cadcf2718c86c2e2d18753ca1d9f1f3313068980794b24f2"

ingress:
  enabled: false

rbac:
  extraClusterRoleBindings:
    - name: view
      roleRef:
        name: view
        external: true

config:
  # TOML keys, not CLI flags — this image dropped --read-only/
  # --disable-destructive; --config/--config-dir is all that's left.
  read_only: true
  disable_destructive: true
  # core-only: drops configuration_view, which leaks this server's own
  # live ServiceAccount token.
  toolsets: [core]
  denied_resources:
    - group: ""
      version: v1
      kind: Secret

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 64Mi
