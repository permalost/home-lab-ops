# See hermes-sage/config/config.yaml — identical, both instances share the
# same vllm backends (vLLM/continuous batching handles concurrent agents fine).
# Home Assistant connection/tool wiring is not set up yet — this instance is
# presently just Hermes pointed at the local models, same as hermes-sage.
model:
  provider: custom
  base_url: http://vllm-main.vllm.svc.cluster.local:8000/v1
  default: qwen3.6-27b
  context_length: 64000

# Registers vllm-aux as a second user-selectable model (dashboard model
# picker / `/model` in chat) — distinct from auxiliary_models below, which
# only routes specific internal tasks to it and doesn't make it selectable
# on its own.
providers:
  vllm-aux:
    base_url: http://vllm-aux.vllm.svc.cluster.local:8000/v1
    models:
      - qwen3.6-35b-a3b
    context_length: 65536

auxiliary_models:
  title:
    provider: custom
    base_url: http://vllm-aux.vllm.svc.cluster.local:8000/v1
    model: qwen3.6-35b-a3b
  compression:
    provider: custom
    base_url: http://vllm-aux.vllm.svc.cluster.local:8000/v1
    model: qwen3.6-35b-a3b
  approval:
    provider: custom
    base_url: http://vllm-aux.vllm.svc.cluster.local:8000/v1
    model: qwen3.6-35b-a3b
  web_extraction:
    provider: custom
    base_url: http://vllm-aux.vllm.svc.cluster.local:8000/v1
    model: qwen3.6-35b-a3b
