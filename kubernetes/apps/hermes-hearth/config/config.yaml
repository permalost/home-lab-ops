# See hermes-sage/config/config.yaml for the shared vllm-backend shape.
# Home Assistant is wired up (see README "Home Assistant") — HASS_URL/
# HASS_TOKEN env vars auto-activate the ha_* tools, no config here needed.

# GitOps-delivered skill (see README "Skills") — mounted read-only from a
# ConfigMap (patches/deploy-mount-skills.yaml), not written by skill_manage.
# Absolute path: external_dirs resolves relative paths against HERMES_HOME,
# not cwd. The skill loader is cached per session — a running session won't
# see this until a new one starts.
skills:
  external_dirs: [/opt/skills-external]

model:
  provider: custom
  base_url: http://main.external-endpoints.svc.cluster.local:8888/v1
  default: GLM-5.3-Flash-EXL3
  # Matches the server's --max-model-len exactly — see
  # external-endpoints/main/README.md. Retuned 2026-09-04 for the
  # DeepSeek->GLM swap (was 1048576) — see "Compression" below, its
  # threshold_tokens is scaled to match.
  context_length: 1000000
  # Reserves output space out of context_length. Required regardless of
  # context_length's value: unset, the request goes out with
  # max_tokens=<server's --max-model-len>, so vLLM 400s every call and
  # Hermes misroutes that into compression. Observed peak output is 1746
  # tokens. See "Output cap" below.
  max_tokens: 8192

# vllm-aux retired along with the old in-cluster Qwen pair. No separate aux
# model — everything points at the same external LLM endpoint as `model`
# above (see kubernetes/apps/external-endpoints/main/README.md for which
# model that is). Registered here, not deleted, so it stays selectable in
# the dashboard picker, same as before. Picker changes don't persist here —
# see README "Model" — but the entry is kept for parity with hermes-sage and
# for manual /model use.
providers:
  vllm-aux:
    base_url: http://aux.external-endpoints.svc.cluster.local:8888/v1
    models:
      - GLM-5.3-Flash-EXL3
    context_length: 1000000

auxiliary_models:
  title:
    provider: custom
    base_url: http://aux.external-endpoints.svc.cluster.local:8888/v1
    model: GLM-5.3-Flash-EXL3
  compression:
    provider: custom
    base_url: http://aux.external-endpoints.svc.cluster.local:8888/v1
    model: GLM-5.3-Flash-EXL3
  approval:
    provider: custom
    base_url: http://aux.external-endpoints.svc.cluster.local:8888/v1
    model: GLM-5.3-Flash-EXL3
  web_extraction:
    provider: custom
    base_url: http://aux.external-endpoints.svc.cluster.local:8888/v1
    model: GLM-5.3-Flash-EXL3

# Defaults protect first_n(3)+last_n(20)=23 messages against 8-16 message
# sessions here — the compressible middle window was empty, so compression
# still ran a 57-145s summarizer call and returned messages=N->N. See
# README "Home Assistant" for the telemetry that led to these values.
compression:
  protect_last_n: 6
  protect_first_n: 1

  # Sessions here peaked ~31k of the old 65k window; default 0.50 fired
  # with ample headroom left. threshold_tokens scaled for context_length —
  # keeps the same 75%-of-window trigger point the fraction below already
  # specifies. Re-measure actual peak-context telemetry before trusting
  # this fires appropriately at the new scale; nothing here has been
  # observed against real 1M-context sessions yet.
  threshold: 0.75
  threshold_tokens: 750000

  # One attempt ran 718s despite the documented 600s ceiling. Past ~45s
  # with a non-empty middle window, abandon rather than stall the session.
  context_timeout_seconds: 45
  context_total_ceiling_seconds: 120

  # Deterministic tool-result pruning — no LLM call, so it can't stall.
  # Default min-thresholds were sized for large tool results; ha_* results
  # are 82-605 chars post area-filtering (see hermes's own MEMORY.md) —
  # but an unfiltered ha_list_entities measured 90,794 chars, so the large
  # case is real. Note: no prune event has ever appeared in agent.log.
  proactive_prune_tokens: 12000
  proactive_prune_min_result_chars: 3000
  proactive_prune_min_reclaim_tokens: 2048
