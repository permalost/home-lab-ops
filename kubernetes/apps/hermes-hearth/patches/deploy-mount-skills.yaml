# Directory mount (not subPath — subPath mounts don't pick up live
# ConfigMap updates, see deploy-mount-configmap.yaml's config.yaml mount for
# the case where that's fine). skills.external_dirs (config.yaml) expects
# to walk <dir>/<category>/<name>/SKILL.md; items: synthesizes that nesting
# from the flat ConfigMap key (ConfigMap keys can't contain "/").
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: skills-external
    configMap:
      name: hermes-skills
      items:
        - key: homebox-SKILL.md
          path: productivity/homebox/SKILL.md
        - key: unifi-SKILL.md
          path: network/unifi/SKILL.md
        - key: maintenance-SKILL.md
          path: kubernetes/maintenance/SKILL.md
        - key: truenas-SKILL.md
          path: infra/truenas/SKILL.md
        - key: truenas-api.md
          path: infra/truenas/references/api.md
        - key: truenas-optimization.md
          path: infra/truenas/references/optimization.md
        - key: truenas-tn.py
          path: infra/truenas/scripts/tn.py
        - key: watchers-SKILL.md
          path: devops/watchers/SKILL.md
        - key: watchers-_watermark.py
          path: devops/watchers/scripts/_watermark.py
        - key: watchers-watch_github.py
          path: devops/watchers/scripts/watch_github.py
        - key: watchers-watch_http_json.py
          path: devops/watchers/scripts/watch_http_json.py
        - key: watchers-watch_rss.py
          path: devops/watchers/scripts/watch_rss.py
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: skills-external
    mountPath: /opt/skills-external
