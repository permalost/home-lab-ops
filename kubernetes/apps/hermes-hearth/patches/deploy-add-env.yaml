- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
    - name: API_SERVER_ENABLED
      value: "true"
    - name: API_SERVER_HOST
      value: "0.0.0.0"
    - name: API_SERVER_KEY
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: API_SERVER_KEY
    # Dashboard (see README.md "Dashboard"). HERMES_DASHBOARD gates the s6
    # service itself — unset, it exits immediately and the slot reports
    # down. Non-loopback binds require an auth provider or the dashboard
    # fails closed; basic auth is the bundled zero-IDP option.
    - name: HERMES_DASHBOARD
      value: "1"
    - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
    - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
    # Cilium Gateway's proxy-header forwarding isn't guaranteed reliable
    # for this — declare the real external URL so OAuth-style redirect
    # logic (unused here, but shared code path) doesn't have to guess.
    - name: HERMES_DASHBOARD_PUBLIC_URL
      value: "https://hermes-hearth.orion.norseamerican.com"
    # Home Assistant integration (see README "Home Assistant"). HASS_TOKEN
    # alone auto-activates the ha_* device-control tools; the gateway's
    # realtime event forwarding is separate and needs platforms.homeassistant
    # in config.yaml (not set up here — see README).
    - name: HASS_URL
      value: "https://ha.orion.norseamerican.com"
    - name: HASS_TOKEN
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: HASS_TOKEN
    # Homebox integration (see skills/homebox/SKILL.md). Unlike HASS_TOKEN
    # these aren't upstream-fixed names — just have to agree with the
    # skill's prerequisites.env_vars. In-cluster URL, no Gateway round-trip
    # (same choice as HA's Grocy/Neurio rest: sensors).
    - name: HOMEBOX_URL
      value: "http://homebox-svc.homebox.svc.cluster.local:8080"
    - name: HOMEBOX_API_KEY
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: HOMEBOX_API_KEY
