- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
    - name: API_SERVER_ENABLED
      value: "true"
    - name: API_SERVER_HOST
      value: "0.0.0.0"
    - name: API_SERVER_KEY
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: API_SERVER_KEY
    # Dashboard (see README.md "Dashboard"). HERMES_DASHBOARD gates the s6
    # service itself — unset, it exits immediately and the slot reports
    # down. Non-loopback binds require an auth provider or the dashboard
    # fails closed; basic auth is the bundled zero-IDP option.
    - name: HERMES_DASHBOARD
      value: "1"
    - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
    - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
    # Cilium Gateway's proxy-header forwarding isn't guaranteed reliable
    # for this — declare the real external URL so OAuth-style redirect
    # logic (unused here, but shared code path) doesn't have to guess.
    - name: HERMES_DASHBOARD_PUBLIC_URL
      value: "https://hermes-hearth.orion.norseamerican.com"
    # Home Assistant integration (see README "Home Assistant"). HASS_TOKEN
    # alone auto-activates the ha_* device-control tools; the gateway's
    # realtime event forwarding is separate and needs platforms.homeassistant
    # in config.yaml (not set up here — see README).
    - name: HASS_URL
      value: "https://ha.orion.norseamerican.com"
    - name: HASS_TOKEN
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: HASS_TOKEN
    # Homebox integration (see skills/homebox/SKILL.md). Unlike HASS_TOKEN
    # these aren't upstream-fixed names — just have to agree with the
    # skill's prerequisites.env_vars. In-cluster URL, no Gateway round-trip
    # (same choice as HA's Grocy/Neurio rest: sensors).
    - name: HOMEBOX_URL
      value: "http://homebox-svc.homebox.svc.cluster.local:8080"
    - name: HOMEBOX_API_KEY
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: HOMEBOX_API_KEY
    # UniFi network integration (see skills/unifi/SKILL.md). Goes through
    # the Gateway (apps/external-endpoints/unifi/), not a cluster-local
    # Service — the controller itself is a physical device on the LAN, not
    # something running in-cluster. verify=true works here (unlike the
    # audit.py tool on the Mac, which talks to 10.20.0.1 directly and has
    # to bypass the self-signed cert) because BackendTLSPolicy already
    # validated the hop using unifi-ca's pinned cert.
    - name: UNIFI_URL
      value: "https://unifi.orion.norseamerican.com"
    - name: UNIFI_USER
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: UNIFI_USER
    - name: UNIFI_PASSWORD
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: UNIFI_PASSWORD
    # Telegram gateway platform — two-way notification/chat channel.
    # TELEGRAM_ALLOWED_USERS is load-bearing, not optional: with no
    # allowlist set, the gateway's authz falls back to an open "pair" mode
    # rather than default-deny (confirmed in gateway/authz_mixin.py).
    # HOME_CHANNEL is the same numeric ID so bare `hermes send --to
    # telegram` reaches Jon's DM.
    - name: TELEGRAM_BOT_TOKEN
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: TELEGRAM_BOT_TOKEN
    - name: TELEGRAM_ALLOWED_USERS
      value: "8852997015"
    - name: TELEGRAM_HOME_CHANNEL
      value: "8852997015"
    # Webhook platform. WEBHOOK_ENABLED is load-bearing, not redundant with
    # config.yaml's platforms.webhook.enabled: true — only the env-var path
    # (gateway/config.py) populates the platform-wide secret from
    # WEBHOOK_SECRET; the YAML-only enable path never reads that var, and
    # writing the secret as a value in config.yaml isn't expanded (confirmed
    # live — see config/config.yaml's route comment).
    - name: WEBHOOK_ENABLED
      value: "true"
    - name: WEBHOOK_SECRET
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: hermesWebhookSecret
    # Fine-grained PAT, home-lab-ops only, Contents+PRs read/write — see
    # skills/maintenance/SKILL.md "Opening a fix". main itself is what
    # actually blocks a direct landing, not this scope.
    #
    # NOT named GITHUB_TOKEN: that name is reserved by Hermes itself (its
    # Skills Hub feature) and gets unconditionally stripped from every
    # terminal-tool subprocess by tools/env_passthrough.py's provider-
    # credential blocklist (GHSA-rhgp-j443-p4rf) — no skill declaration or
    # config.yaml override can pass it through. Confirmed live: every
    # maintenance-skill session since #172 logged "refusing to register
    # Hermes provider credential 'GITHUB_TOKEN'" and every git push/PR
    # curl ran with an empty token. Renaming, not the value, fixes it.
    - name: MAINTENANCE_GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: GITHUB_TOKEN
    #
    # Paperclip (company W.D.O.): the maintenance skill files each alert investigation there as a
    # `todo` issue assigned to the triage agent in the Cluster Alerts project, or comments on the
    # open issue the alert already has (skills/maintenance/SKILL.md, "Filing the finding in
    # Paperclip"). The in-cluster URL keeps filing working when the gateway is down; Paperclip's
    # hostname guard rejects the in-cluster Host, so requests send PAPERCLIP_HOST.
    - name: PAPERCLIP_API_URL
      value: "http://paperclip.paperclip.svc.cluster.local:3100"
    - name: PAPERCLIP_HOST
      value: "paperclip.orion.norseamerican.com"
    - name: PAPERCLIP_COMPANY_ID
      value: "9adf9ab3-e240-4ec5-9f9a-8eb53ca1a952"
    - name: PAPERCLIP_TRIAGE_AGENT_ID
      value: "f8ce9a9d-f819-42b7-9161-14c27866536d"
    - name: PAPERCLIP_ALERTS_PROJECT_ID
      value: "d5291f3b-5433-4de8-9f16-8d879ae7997d"
    - name: PAPERCLIP_API_KEY
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: PAPERCLIP_API_KEY
