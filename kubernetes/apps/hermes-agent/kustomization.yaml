apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Owns the shared "hermes" namespace only. Deliberately its own Flux
# Kustomization (kubernetes/clusters/orion/hermes-agent.yaml), separate
# from any profile's — every profile's resources live in this namespace,
# so if a profile's Kustomization is ever deleted, Flux's prune must not
# take the Namespace (and every other profile in it) down with it.

resources:
  - namespace.yaml
