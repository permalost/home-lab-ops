apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace "hermes" is shared across every Hermes profile and is
# NOT created here — see kubernetes/apps/hermes-agent/namespace.yaml
# and its own Flux Kustomization. namePrefix is this profile's only
# defense against colliding with another profile's Deployment/
# Service/PVC in that shared namespace — see ../../base/README.md.

resources:
  - ../../base
  - secret.sops.yaml

namespace: hermes
namePrefix: nas-ops-

labels:
  - includeSelectors: true
    pairs:
      app: nas-ops
      app.kubernetes.io/name: hermes-agent

patches:
  - target:
      kind: Deployment
      name: deploy
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: nas-ops-secrets
