apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route
spec:
  parentRefs:
    - name: ${gatewayName}
      namespace: gateway
      sectionName: https
  hostnames:
    - ${subdomain}.${domain}
  rules:
    - backendRefs:
        - name: svc
          # Matches webapp/base's Service port. To run the app on another
          # port, patch the container port once and add the replacements
          # wiring from webapp/README.md — the Service port and this
          # backendRef follow it (see apps/pihole).
          port: 8080
