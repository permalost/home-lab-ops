- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
    - name: API_SERVER_ENABLED
      value: "true"
    - name: API_SERVER_HOST
      value: "0.0.0.0"
    - name: API_SERVER_KEY
      valueFrom:
        secretKeyRef:
          name: hermes-secrets
          key: API_SERVER_KEY
