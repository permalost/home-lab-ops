# TokenTelemetry API, on the Gateway's :18000 listener (see gateway.yaml's
# https-tt listener) — not homepage-listed, the UI route is.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tokentelemetry-api
spec:
  parentRefs:
    - name: ${gatewayName}
      namespace: gateway
      sectionName: https-tt
  hostnames:
    - "tt-sage.${domain}"
  rules:
    - backendRefs:
        - name: svc
          port: 8000
