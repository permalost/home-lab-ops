# Mounted at /opt/data/config.yaml (subPath onto the pvc component's volume —
# see patches/deploy-mount-configmap.yaml). Not secret; API_SERVER_KEY lives
# in secret.yaml instead.
model:
  provider: custom
  base_url: http://deepseek.external-endpoints.svc.cluster.local:8888/v1
  default: deepseek-v4-flash-dspark
  context_length: 65536
  # Reserves output space out of context_length, leaving 57344 for input.
  # Required: unset, the request goes out with max_tokens=65536 (the whole
  # window), so vLLM 400s every call and Hermes misroutes that into
  # compression. See hermes-hearth/README.md "Output cap".
  max_tokens: 8192

# vllm-aux retired along with the old in-cluster Qwen pair. No separate aux
# model — everything points at the same external LLM endpoint as `model`
# above (see kubernetes/apps/external-endpoints/deepseek/README.md for which
# model that is). Registered here, not deleted, so it stays selectable in
# the dashboard picker, same as before.
providers:
  vllm-aux:
    base_url: http://deepseek.external-endpoints.svc.cluster.local:8888/v1
    models:
      - deepseek-v4-flash-dspark
    context_length: 65536

auxiliary_models:
  title:
    provider: custom
    base_url: http://deepseek.external-endpoints.svc.cluster.local:8888/v1
    model: deepseek-v4-flash-dspark
  compression:
    provider: custom
    base_url: http://deepseek.external-endpoints.svc.cluster.local:8888/v1
    model: deepseek-v4-flash-dspark
  approval:
    provider: custom
    base_url: http://deepseek.external-endpoints.svc.cluster.local:8888/v1
    model: deepseek-v4-flash-dspark
  web_extraction:
    provider: custom
    base_url: http://deepseek.external-endpoints.svc.cluster.local:8888/v1
    model: deepseek-v4-flash-dspark
