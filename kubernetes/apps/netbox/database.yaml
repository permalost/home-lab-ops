apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbox-db
spec:
  instances: 1
  # Pinned to the first post-eMudhra-fix weekly build (2026-10-26); the
  # operator default tag is floating and never rolls existing pods.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-system-trixie
  storage:
    size: 5Gi
    storageClass: rook-ceph-block
  # Creates Secret netbox-db-app (host, port, dbname, user, password, uri, ...)
  # that the netbox and netbox-worker Deployments read their DB_* env from.
  bootstrap:
    initdb:
      database: netbox
      owner: netbox
