apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip
  annotations:
    ignore-check.kube-linter.io/env-value-from: "paperclip-db-app is created by CNPG at runtime"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperclip
  template:
    metadata:
      labels:
        app: paperclip
    spec:
      # No agent process in this pod may call the Kubernetes API (WDO-144).
      # The @paperclipai/plugin-kubernetes sandbox provider is the only
      # Paperclip feature that reads the token; it is not installed here.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: paperclip
          image: ghcr.io/paperclipai/paperclip:2026.1023.0
          ports:
            - name: http
              containerPort: 3100
          env:
            - name: PAPERCLIP_CONFIG
              value: /config/config.json
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: authenticated
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: private
            - name: PAPERCLIP_PUBLIC_URL
              value: https://paperclip.${domain}
            - name: BETTER_AUTH_URL
              value: https://paperclip.${domain}
            - name: PAPERCLIP_TELEMETRY_DISABLED
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: paperclip-db-app
                  key: uri
            # Custom OpenCode provider for the local GLM (agents use model spark/GLM-5.3-Flash-EXL3).
            # output=8192: the server rejects requests without a max_tokens cap (see external-endpoints/main).
            - name: PAPERCLIP_OPENCODE_PROVIDERS
              value: '{"spark":{"npm":"@ai-sdk/openai-compatible","name":"Spark GLM","options":{"baseURL":"http://main.external-endpoints.svc.cluster.local:8888/v1"},"models":{"GLM-5.3-Flash-EXL3":{"name":"GLM 5.3 Flash","limit":{"context":1000000,"output":8192}}}}}'
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperclip-secrets
                  key: BETTER_AUTH_SECRET
            - name: PAPERCLIP_AGENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperclip-secrets
                  key: PAPERCLIP_AGENT_JWT_SECRET
            # From `claude setup-token` via `task paperclip:claude-token`; claude_local
            # agents stay unauthenticated until it is set.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperclip-secrets
                  key: CLAUDE_CODE_OAUTH_TOKEN
                  optional: true
          # The hostname guard 403s the kubelet's default Host (pod IP).
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders: [{name: Host, value: "paperclip.${domain}"}]
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders: [{name: Host, value: "paperclip.${domain}"}]
            initialDelaySeconds: 60
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /paperclip}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperclip-data
        - name: config
          configMap:
            name: paperclip-config
        - name: tmp
          emptyDir: {}
