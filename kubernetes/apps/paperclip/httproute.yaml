apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperclip
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Paperclip"
    gethomepage.dev/description: "Agent orchestrator"
    gethomepage.dev/group: "Platform"
    gethomepage.dev/icon: "paperclip.png"
spec:
  parentRefs:
    - name: ${gatewayName}
      namespace: gateway
      sectionName: https
  hostnames:
    - paperclip.${domain}
  rules:
    - backendRefs:
        - name: paperclip
          port: 3100
