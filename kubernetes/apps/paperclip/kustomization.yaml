apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperclip
resources:
  - namespace.yaml
  - secret.yaml
  - forgejo-tokens.sops.yaml
  - github-tokens.sops.yaml
  - hobbes-readonly.yaml
  - hobbes-readonly-token.sops.yaml
  - database.yaml
  - objectstore.yaml
  - backup.yaml
  - pvc.yaml
  - service.yaml
  - httproute.yaml
  - deployment.yaml
  - bootstrap-job.yaml
  - nudger-cronjob.yaml
  - nudger-token.sops.yaml
  - rustfs-credentials.sops.yaml
  - backup-pvc.yaml
  - backup-cronjob.yaml
  - restic-password.sops.yaml
configMapGenerator:
  - name: paperclip-config
    files:
      - config.json
  - name: paperclip-nudger-script
    files:
      - nudger.mjs
patches:
  - path: cluster-wal-archiver-patch.yaml
