  - secret.yaml
  - forgejo-tokens.sops.yaml
  - database.yaml
  - pvc.yaml
  - service.yaml
  - httproute.yaml
  - deployment.yaml
  - bootstrap-job.yaml

configMapGenerator:
- name: paperclip-config
  files:
  - config.json
