ipam:
  mode: kubernetes
kubeProxyReplacement: true
securityContext:
  capabilities:
    ciliumAgent:
    - CHOWN
    - KILL
    - NET_ADMIN
    - NET_RAW
    - IPC_LOCK
    - SYS_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cleanCiliumState:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
k8sServiceHost: localhost
k8sServicePort: 7445
# Gateway API CRDs are NOT bundled with Cilium ≥1.16.
# They are installed separately via kubernetes/infrastructure/gateway-api/ and must exist before
# the operator starts (the cilium Kustomization depends on gateway-api). Cilium 1.20 needs the
# v1.6.x standard CRDs, all seven including tlsroutes (see Cilium's Gateway API docs for the
# required version when bumping Cilium).
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
  gatewayClass:
    create: "true"
  hostNetwork:
    enabled: false
# for clusters with a single node
operator:
  replicas: 1
  rollOutPods: true
  # The operator checks the Gateway API CRDs only at startup and disables its Gateway controller if
  # they are missing or too old. Changing this value rolls the operator (and only the operator) so it
  # re-checks: bump it whenever the CRD version in infrastructure/gateway-api changes.
  podAnnotations:
    gateway-api-crds: v1.6.3
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    # ingress:
    #   enabled: true
    #   ingressClassName: cilium
# hostFirewall:
#   enabled: true
ingressController:
  enabled: true
  loadbalancerMode: shared
  default: false

bgpControlPlane:
  enabled: true
rollOutCiliumPods: true

# L2 Announcements
# enableL2Announcements: true
l2announcements:
  enabled: true
  leaseDuration: 3s
  leaseRenewDeadline: 1s
  leaseRetryPeriod: 200ms
tls:
  secretsNamespace:
    name: "cilium"
externalIPs:
  enable: true
