role: Agent

# Agent only ships logs out; nothing sends traffic in. Without this the
# chart's default Service gets zero ports (nothing in customConfig listens
# on one) and Helm install fails: "Service is invalid: spec.ports: Required
# value".
service:
  enabled: false

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

customConfig:
  data_dir: /vector-data-dir
  api:
    enabled: false
  sources:
    k8s_logs:
      type: kubernetes_logs
  sinks:
    victorialogs:
      type: elasticsearch
      inputs: [k8s_logs]
      endpoints:
        - http://victorialogs-victoria-logs-single-server.monitoring.svc.cluster.local:9428/insert/elasticsearch/
      api_version: v8
      compression: gzip
      healthcheck:
        enabled: false
      query:
        _msg_field: message
        _time_field: timestamp
        _stream_fields: kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name
