apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 15m
  dependsOn:
    - name: cloudnative-pg
  chart:
    spec:
      # v0.9.0 ships plugin-barman-cloud v0.16.0 (plugin + sidecar images below).
      # The plugin requires CNPG 1.30+ (the cloudnative-pg HelmRelease above)
      # and cert-manager for its TLS certificates, hence the dependsOn.
      chart: plugin-barman-cloud
      version: "0.9.0"
      sourceRef:
        kind: HelmRepository
        name: cnpg
      interval: 15m
  releaseName: plugin-barman-cloud
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: plugin-barman-cloud-helm-chart-values
      valuesKey: plugin-barman-cloud-values.yaml
