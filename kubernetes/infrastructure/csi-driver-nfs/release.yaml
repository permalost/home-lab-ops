apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: csi-driver-nfs
  annotations:
    # One-shot forced install: the first install exhausted install.remediation.retries
    # on 2026-11-05 while the namespace was still rejected by Pod Security (fixed in
    # #299), leaving the release Stalled. The controller acts on these tokens once and
    # ignores the same values afterwards; to re-force a release, change both to a new
    # arbitrary token.
    # https://fluxcd.io/flux/components/helm/helmreleases/#forcing-a-release
    reconcile.fluxcd.io/requestedAt: "2026-11-16T04:30:00Z-wdo-194"
    reconcile.fluxcd.io/forceAt: "2026-11-16T04:30:00Z-wdo-194"
spec:
  interval: 30m
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.6"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: csi-driver-nfs-helm-chart-values
      valuesKey: values.yaml
