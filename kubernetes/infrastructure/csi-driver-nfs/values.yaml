# Static PVs (nas-books / nas-prints / nas-photos) are the main NFS consumers;
# dynamic provisioning is per-app (first: nfs-backups-pg in kubernetes/apps/
# rustfs/, GH #324). Keep the extra chart objects off and no chart StorageClass.
storageClass:
  create: false
volumeSnapshotClass:
  create: false
externalSnapshotter:
  enabled: false
