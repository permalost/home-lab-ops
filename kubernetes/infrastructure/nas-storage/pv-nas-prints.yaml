apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-prints
  labels:
    app.kubernetes.io/name: nas-storage
    app.kubernetes.io/component: nas-prints
spec:
  capacity:
    storage: 1Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4
    - hard
  nfs:
    server: ${nasNfsIp}
    path: /mnt/storage/prints
