apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: nvidia-device-plugin
spec:
  interval: 15m
  chart:
    spec:
      chart: nvidia-device-plugin
      version: "0.17.4"
      sourceRef:
        kind: HelmRepository
        name: nvidia-device-plugin
      interval: 15m
  releaseName: nvidia-device-plugin
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: nvidia-device-plugin-helm-chart-values
      valuesKey: values.yaml
