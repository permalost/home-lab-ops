# The snapshotter sidecar uses the provisioner cephx user for snapshots:
# rook creates only `rook-csi-rbd-provisioner` and `rook-csi-rbd-node`
# (pkg/operator/ceph/csi/secrets.go in rook 1.21); `osd profile rbd` covers
# snapshot create/delete. clusterID matches the StorageClass in blockpool.yaml.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: rook-ceph-rbd
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  csi.storage.k8s.io/snapshotter-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/snapshotter-secret-namespace: rook-ceph
deletionPolicy: Delete
