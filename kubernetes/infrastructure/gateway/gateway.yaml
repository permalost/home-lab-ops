apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: orion
  namespace: gateway
  annotations:
    io.cilium/lb-ipam-ips: "10.50.0.231"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.networking.k8s.io/access: "true"
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-orion-tls
            namespace: cilium
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.networking.k8s.io/access: "true"
    # TokenTelemetry's frontend calls its API at window.location.hostname on
    # this fixed port (baked into the upstream image) — cross-origin from 443,
    # so it needs its own listener rather than a path route.
    - name: https-tt
      protocol: HTTPS
      port: 18000
      hostname: "*.${domain}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-orion-tls
            namespace: cilium
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.networking.k8s.io/access: "true"
