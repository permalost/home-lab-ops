apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: cilium
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Hubble"
    gethomepage.dev/description: "Cilium network observability"
    gethomepage.dev/group: "Cluster"
    gethomepage.dev/icon: "cilium.png"
spec:
  parentRefs:
    - name: orion
      namespace: gateway
      sectionName: https
  hostnames:
    - "hubble.${domain}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hubble-ui
          port: 80
