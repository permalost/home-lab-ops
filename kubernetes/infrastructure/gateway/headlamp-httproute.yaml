apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Headlamp"
    gethomepage.dev/description: "Cluster dashboard"
    gethomepage.dev/group: "Platform"
    gethomepage.dev/icon: "kubernetes.png"
spec:
  parentRefs:
    - name: orion
      namespace: gateway
      sectionName: https
  hostnames:
    - "headlamp.${domain}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
