alertmanager:
  spec:
    # Alerts span every namespace, not just monitoring. selectAllByDefault
    # is already the chart default; set explicitly to survive a chart bump.
    selectAllByDefault: true
    disableNamespaceMatcher: true
    # Mounted by the operator at /etc/vm/secrets/<name>/<key> — read by the
    # webhook-hermes receiver below.
    secrets:
      - alertmanager-hermes
  # webhook-hermes lives in the base config, not a VMAlertmanagerConfig: the
  # operator drops unknown http_config keys (e.g. http_headers) from CR
  # receivers. telegram-hermes (alerting/alertmanagerconfig.yaml) stays a CR
  # since it needs no custom headers.
  config:
    route:
      receiver: blackhole
      routes:
        - receiver: webhook-hermes
          continue: true
          group_by: ["alertname"]
          # Coalesce cascades before fanout. repeat_interval up from 4h:
          # Alertmanager sends no delivery-id header, so Hermes's webhook
          # idempotency never hits and every repeat re-investigates.
          group_wait: 2m
          group_interval: 10m
          repeat_interval: 24h
          matchers:
            - severity=~"warning|critical"
    receivers:
      - name: blackhole
      - name: webhook-hermes
        webhook_configs:
          - url: http://hermes-hearth-svc.hermes-hearth.svc.cluster.local:8644/webhooks/cluster-alert
            send_resolved: false # don't investigate already-fixed alerts
            max_alerts: 2 # keeps payload under the prompt's {__raw__} truncation cap
            http_config:
              http_headers:
                # Hermes's only auth mode Alertmanager can satisfy — it
                # can't compute an HMAC. Must equal hermes-secrets'
                # hermesWebhookSecret byte-for-byte (see README).
                X-Gitlab-Token:
                  files:
                    - /etc/vm/secrets/alertmanager-hermes/token
                # Alertmanager's payload has no event_type/type key; without
                # this the route's events:["alert"] filter drops every
                # delivery and still returns 200.
                X-Gitlab-Event:
                  values: ["alert"]
    # Chart ships no inhibit rules; one root cause was firing 3 alerts/pod.
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: [alertname, namespace]
      - source_matchers:
          - alertname="KubePodCrashLooping"
        target_matchers:
          - alertname=~"KubePodNotReady|KubeDeploymentReplicasMismatch"
        equal: [namespace]
      - source_matchers:
          - alertname="TargetDown"
        target_matchers:
          - alertname=~".*InstanceUnreachable|ScrapePoolHasNoTargets"
        equal: [namespace]
  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Alertmanager"
      gethomepage.dev/description: "Cluster alert routing"
      gethomepage.dev/group: "Observability"
      gethomepage.dev/icon: "alertmanager.png"
    hosts:
      - "alertmanager.${domain}"
# Talos issues these static pods' serving certs for localhost/127.0.0.1
# only, so TLS verification fails once bind-address is opened up to scrape
# by node IP (see clusters/orion/patches/controlplane). Overriding the full
# endpoints list, not just tlsConfig, because Helm replaces lists wholesale
# rather than merging by index.
kubeControllerManager:
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecureSkipVerify: true
# etcd runs as a Talos static pod without the chart's `component: etcd`
# label, so the default selector-matched Service resolves no Endpoints and
# the kube-etcd scrape pool stays empty (ScrapePoolHasNoTargets). Setting
# endpoints makes the chart emit manual Endpoints for a headless Service
# and drop the selector entirely. The scrape is plain http: 2381 is the
# unauthenticated metrics listener etcd serves via listen-metrics-urls
# (clusters/orion/patches/controlplane/00-etcd.yaml), so no bearer token or
# TLS config. Deleting this block silently empties the pool again.
kubeEtcd:
  endpoints:
    - 10.50.0.11
    - 10.50.0.12
    - 10.50.0.13
  service:
    port: 2381
    targetPort: 2381
  vmScrape:
    spec:
      jobLabel: app.kubernetes.io/component
      namespaceSelector:
        matchNames: []
      endpoints:
        # Full override, same reason as kubeControllerManager above: Helm
        # replaces lists wholesale. Drops the default bearerTokenFile and
        # https tlsConfig meant for the 2379 listener.
        - port: http-metrics
          scheme: http
kubeScheduler:
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: http-metrics
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            insecureSkipVerify: true
grafana:
  # Needs internet access to install (see infrastructure/victorialogs).
  plugins:
    - victoriametrics-logs-datasource
  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Grafana"
      gethomepage.dev/description: "Metrics & logs dashboards"
      gethomepage.dev/group: "Observability"
      gethomepage.dev/icon: "grafana.png"
    hosts:
      - "grafana.${domain}"
    tls:
      - secretName: grafana-tls
        hosts:
          - "grafana.${domain}"
vmagent:
  ingress:
    enabled: true
    ingressClassName: cilium
    hosts:
      - "vmagent.${domain}"
vmalert:
  ingress:
    enabled: true
    ingressClassName: cilium
    hosts:
      - "vmalert.${domain}"
vmsingle:
  spec:
    # Persistent storage so metrics history survives node reboots. Retention
    # stays at the chart default retentionPeriod: "1" (1 month). Ingest
    # measured 2026-10-30 at ~11.2k rows/s and ~0.22 on-disk bytes/row, so one
    # month is ~6.4 GB; 10Gi leaves headroom for series growth.
    storage:
      storageClassName: rook-ceph-block
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
  ingress:
    enabled: true
    ingressClassName: cilium
    hosts:
      - "vmsingle.${domain}"
