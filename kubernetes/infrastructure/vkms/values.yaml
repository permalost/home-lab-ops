alertmanager:
  spec:
    # Alerts span every namespace, not just monitoring. selectAllByDefault
    # is already the chart default; set explicitly to survive a chart bump.
    selectAllByDefault: true
    disableNamespaceMatcher: true
  ingress:
    enabled: true
    ingressClassName: cilium
    hosts:
      - "alertmanager.${domain}"
grafana:
  # Needs internet access to install (see infrastructure/victorialogs).
  plugins:
    - victoriametrics-logs-datasource
  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - "grafana.${domain}"
    tls:
      - secretName: grafana-tls
        hosts:
          - "grafana.${domain}"
vmagent:
  ingress:
    enabled: true
    ingressClassName: cilium
    hosts:
      - "vmagent.${domain}"
vmalert:
  ingress:
    enabled: true
    ingressClassName: cilium
    hosts:
      - "vmalert.${domain}"
vmsingle:
  spec:
    storage: null
  ingress:
    enabled: true
    ingressClassName: cilium
    hosts:
      - "vmsingle.${domain}"
