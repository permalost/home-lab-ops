# Additive alerting config, merged by the operator into the chart's default
# `blackhole`-only config (alertmanager.spec.config in values.yaml) — that
# base config, its receivers, and its default route are untouched.
# Needs alertmanager.spec.disableNamespaceMatcher: true (values.yaml) since
# VMAlertmanagerConfig is namespace-scoped by default and alerts span every
# app namespace, not just `monitoring`.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: telegram-hermes
spec:
  route:
    receiver: telegram-hermes
    continue: true
    matchers:
      - severity=~"warning|critical"
    # Without this, every matching alert lands in one undifferentiated
    # group — 19 alerts at once blew past Telegram's 4096-char limit and
    # got silently dropped ("message too long").
    group_by: ["alertname"]
  receivers:
    - name: telegram-hermes
      telegram_configs:
        - bot_token:
            name: alertmanager-telegram
            key: botToken
          chat_id: 8852997015
          # parse_mode: "" silently reverts to HTML (confirmed live) — no
          # way to force plain text, so escaping the dynamic field instead.
          # Bounded to 10 alerts: still needed even with group_by, since
          # the default template's per-alert dump can still overflow 4096
          # chars if enough share one alertname.
          message: |
            {{ .CommonLabels.alertname }} ({{ .Status }}) — {{ len .Alerts }} alert(s), showing up to 10:
            {{ range $i, $a := .Alerts }}{{ if lt $i 10 }}• {{ $a.Labels.namespace }}: {{ reReplaceAll ">" "&gt;" (reReplaceAll "<" "&lt;" (reReplaceAll "&" "&amp;" $a.Annotations.description)) }}
            {{ end }}{{ end }}
